<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:#0c0c0b;">
  <!-- Email exclusivo de Lemon RX (proyecto Supabase "Lemon RX"). -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#0c0c0b" style="background:#0c0c0b;padding:40px 20px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;font-family:Barlow,Helvetica,Arial,sans-serif;color:#f3f3ee;">
        <tr><td style="padding:0 0 32px;border-bottom:1px solid #2b2b27;">
          <span style="font-family:'Barlow Condensed','Arial Narrow',Helvetica,Arial,sans-serif;font-size:34px;font-weight:800;font-style:italic;letter-spacing:0.5px;line-height:1;color:#f3f3ee;">LEMON<span style="color:#e3ef3f;"> RX</span></span>
        </td></tr>
        <tr><td style="padding:32px 0 0;">
          <h1 style="margin:0 0 16px;font-family:'Barlow Condensed','Arial Narrow',Helvetica,Arial,sans-serif;font-size:34px;font-weight:700;line-height:1;text-transform:uppercase;color:#f3f3ee;">Crea una contraseña nueva</h1>
          <p style="margin:0 0 28px;font-size:17px;line-height:1.6;color:#b9b9b0;">Hemos recibido una petición para cambiar la contraseña de tu cuenta de Lemon RX. Pulsa el botón para elegir una nueva.</p>
          <table role="presentation" cellpadding="0" cellspacing="0"><tr><td bgcolor="#e3ef3f" style="border-radius:4px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 26px;font-family:'Barlow Condensed','Arial Narrow',Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;text-decoration:none;color:#171a00;">Cambiar contraseña</a>
          </td></tr></table>
          <p style="margin:28px 0 0;font-size:14px;line-height:1.6;color:#8a8a81;">Si no lo has pedido tú, ignora este mensaje: tu contraseña seguirá siendo la misma.</p>
        </td></tr>
        <tr><td style="padding:40px 0 0;font-size:13px;color:#8a8a81;">Lemon RX · Programación de CrossFit</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
