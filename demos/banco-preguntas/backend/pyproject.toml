[project]
name = "banco-preguntas"
version = "0.1.0"
description = "Generador de preguntas tipo test verificables a partir de documentos"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "email-validator>=2.1",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "pillow>=10",
  "python-docx>=1.1",
  "anthropic>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
